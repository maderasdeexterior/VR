<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Confirmar tickets</title>

<link id="favicon" rel="icon" href="">
<link id="appleicon" rel="apple-touch-icon" href="">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Confirmar tickets">
<meta name="theme-color" content="#1C1B19">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:        #1C1B19;
    --panel:     #26241D;
    --panel-2:   #302D24;
    --line:      #4A4740;
    --text:      #F5F2EA;
    --text-dim:  #ABA69B;
    --yellow:    #F2B705;
    --yellow-ink:#1C1B19;
    --green:     #3D8361;
    --rust:      #C1440E;
    --radius:    6px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body{ padding-bottom:40px; }
  h1,.headline{ font-family:'Big Shoulders Display','Inter',sans-serif; font-weight:800; margin:0; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px; }

  header{ background:var(--panel); border-bottom:3px solid var(--yellow); padding:22px 16px 18px; }
  header .wrap{ padding:0 4px; }
  header h1{ font-size:28px; color:var(--yellow); text-transform:uppercase; }
  header p{ margin:6px 0 0; color:var(--text-dim); font-size:14px; line-height:1.4; }

  .gate{ padding:24px 0; }
  .field{ margin-top:12px; }
  .field label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; background:var(--panel-2); border:2px solid var(--line); border-radius:var(--radius);
    color:var(--text); font-size:16px; font-family:inherit; padding:14px;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--yellow); }

  .btn{
    appearance:none; border:none; border-radius:var(--radius); padding:16px;
    font-size:16px; font-family:'Big Shoulders Display',sans-serif; font-weight:800;
    text-transform:uppercase; letter-spacing:.02em; cursor:pointer; width:100%;
    background:var(--yellow); color:var(--yellow-ink); margin-top:14px;
  }
  .btn.secondary{ background:transparent; border:2px solid var(--yellow); color:var(--yellow); }
  .btn.ghost{ background:transparent; border:2px solid var(--line); color:var(--text-dim); }
  .btn:disabled{ background:var(--line); color:var(--text-dim); }

  .lista{ padding:16px 0; }
  .lista-empty{ color:var(--text-dim); font-size:14px; padding:20px 0; text-align:center; }

  .card{
    background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .card.flag{ border-color:var(--rust); }
  .card .titulo{ font-size:16px; font-weight:700; }
  .card .sub{ font-size:13px; color:var(--text-dim); margin-top:4px; }
  .card .flagtag{
    display:inline-block; margin-top:6px; font-size:11px; font-weight:700;
    color:var(--rust); border:1px solid var(--rust); border-radius:4px; padding:2px 6px;
  }

  .detalle{ display:none; padding:16px 0 40px; }
  .detalle.show{ display:block; }
  .back{ background:none; border:none; color:var(--text-dim); font-size:14px; padding:0; margin-bottom:14px; cursor:pointer; }

  .foto-link{ display:block; margin:10px 0 4px; color:var(--yellow); font-weight:700; font-size:14px; }

  .grupo{ margin-top:18px; }
  .grupo h2{ font-size:15px; color:var(--yellow); text-transform:uppercase; letter-spacing:.02em; margin:0 0 10px; }

  table.articulos{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.articulos th{ text-align:left; color:var(--text-dim); font-weight:600; font-size:12px; padding:4px 4px; }
  table.articulos td{ padding:4px; }
  table.articulos input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    color:var(--text); font-size:13.5px; font-family:inherit; padding:8px 6px;
  }
  table.articulos .col-precio{ width:90px; }
  table.articulos .col-cant{ width:55px; }
  .del-item{ background:none; border:none; color:var(--rust); font-size:18px; cursor:pointer; padding:0 4px; }
  .add-item{ margin-top:8px; font-size:13px; color:var(--yellow); background:none; border:1px dashed var(--yellow); border-radius:4px; padding:8px; width:100%; cursor:pointer; }

  .suma-linea{ margin-top:8px; font-size:12.5px; color:var(--text-dim); }
  .suma-linea.mismatch{ color:var(--rust); font-weight:700; }

  .toast{
    position:fixed; left:16px; right:16px; bottom:24px; background:var(--green); color:#fff;
    padding:12px 14px; border-radius:var(--radius); font-size:14px; font-weight:600; text-align:center;
    display:none; z-index:20;
  }
  .toast.show{ display:block; }
  .toast.err{ background:var(--rust); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Confirmar tickets</h1>
    <p>Revisa lo que el OCR detectó, corrige lo necesario y confirma.</p>
  </div>
</header>

<main class="wrap">

  <!-- CANDADO -->
  <section class="gate" id="gate">
    <div class="field">
      <label for="codigoInput">Tu código</label>
      <input id="codigoInput" type="text" autocapitalize="characters" autocomplete="off" placeholder="Ej. ABCD-ME-T26">
    </div>
    <button class="btn" id="entrarBtn">Ver pendientes</button>
  </section>

  <!-- LISTA -->
  <section class="lista" id="lista" style="display:none;"></section>

  <!-- DETALLE -->
  <section class="detalle" id="detalle"></section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — misma URL del Apps Script de la Herramienta 2
   ============================================================ */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzL-VpVma40cPhpN_WHS4xo9_CF3fs3jtE0rYpi7y1ILjobm0c59C4WDLD-BxW-GJx9/exec"
};
/* ============================================================ */

let codigoActual = "";
let ticketsPendientes = [];
let ticketAbierto = null;

document.getElementById("entrarBtn").addEventListener("click", cargarPendientes);

async function llamar(payload){
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function cargarPendientes(){
  const codigo = document.getElementById("codigoInput").value.trim();
  if (!codigo){ showToast("Escribe tu código.", true); return; }
  codigoActual = codigo;

  const btn = document.getElementById("entrarBtn");
  btn.disabled = true; btn.textContent = "Cargando…";
  try{
    const data = await llamar({ accion: "listar", codigo: codigoActual });
    if (!data.success){
      showToast(data.message || "No se pudo validar el código.", true);
      return;
    }
    ticketsPendientes = data.tickets || [];
    document.getElementById("gate").style.display = "none";
    document.getElementById("lista").style.display = "block";
    renderLista();
  } catch(err){
    showToast("Sin conexión o el servidor no respondió.", true);
  } finally {
    btn.disabled = false; btn.textContent = "Ver pendientes";
  }
}

function renderLista(){
  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  if (ticketsPendientes.length === 0){
    cont.innerHTML = '<div class="lista-empty">No hay tickets pendientes. 🎉</div>';
    return;
  }

  ticketsPendientes.forEach((t, idx) => {
    const card = document.createElement("div");
    card.className = "card" + (t["Revisar artículos"] === "Sí" ? " flag" : "");
    const monto = t["Monto (OCR)"] || t["Monto (declarado)"] || "-";
    card.innerHTML = `
      <div class="titulo">${t["Obra"] || "-"} · ${t["Categoría"] || "-"}</div>
      <div class="sub">${t["Enviado por"] || "-"} · $${monto} · ${t["Forma de pago"] || "-"}</div>
      ${t["Revisar artículos"] === "Sí" ? '<span class="flagtag">Revisar artículos</span>' : ""}
    `;
    card.addEventListener("click", () => abrirDetalle(idx));
    cont.appendChild(card);
  });
}

function abrirDetalle(idx){
  ticketAbierto = JSON.parse(JSON.stringify(ticketsPendientes[idx])); // copia editable
  document.getElementById("lista").style.display = "none";
  const det = document.getElementById("detalle");
  det.classList.add("show");
  renderDetalle();
}

function volverALista(){
  ticketAbierto = null;
  document.getElementById("detalle").classList.remove("show");
  document.getElementById("detalle").innerHTML = "";
  document.getElementById("lista").style.display = "block";
}

function campoEditable(label, key, tipo){
  const val = ticketAbierto[key] ?? "";
  return `
    <div class="field">
      <label>${label}</label>
      <input type="${tipo || 'text'}" data-campo="${key}" value="${String(val).replace(/"/g,'&quot;')}">
    </div>`;
}

function renderDetalle(){
  const t = ticketAbierto;
  const det = document.getElementById("detalle");

  const sumaItems = (t.items || []).reduce((a,it)=> a + (Number(it.precio)||0) * (Number(it.cantidad)||1), 0);
  const montoRef = Number(t["Monto (OCR)"] || t["Monto (declarado)"] || 0);
  const descuadra = montoRef > 0 && Math.abs(sumaItems - montoRef) > 1;

  det.innerHTML = `
    <button class="back" id="backBtn">← Volver a la lista</button>

    <div class="grupo">
      <h2>Datos del correo</h2>
      ${campoEditable("Obra", "Obra")}
      ${campoEditable("Categoría", "Categoría")}
      ${campoEditable("Forma de pago", "Forma de pago")}
      ${campoEditable("Tarjeta", "Tarjeta")}
      ${campoEditable("Nota", "Nota")}
    </div>

    <div class="grupo">
      <h2>Datos del OCR</h2>
      ${campoEditable("Monto (declarado)", "Monto (declarado)")}
      ${campoEditable("Monto (OCR)", "Monto (OCR)")}
      ${campoEditable("Fecha del ticket (OCR)", "Fecha del ticket (OCR)")}
      ${campoEditable("Folio (OCR)", "Folio (OCR)")}
      ${campoEditable("RFC (OCR)", "RFC (OCR)")}
      ${t.fotoUrl ? `<a class="foto-link" href="${t.fotoUrl}" target="_blank">📷 Ver foto original</a>` : '<p class="suma-linea">Sin foto vinculada (revisa configuración de carpeta de Drive).</p>'}
    </div>

    <div class="grupo">
      <h2>Artículos</h2>
      <table class="articulos">
        <thead><tr><th>Producto</th><th class="col-precio">Precio</th><th class="col-cant">Cant.</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button type="button" class="add-item" id="addItemBtn">+ Agregar artículo</button>
      <div class="suma-linea ${descuadra ? 'mismatch' : ''}" id="sumaLinea"></div>
    </div>

    <button class="btn" id="confirmarBtn">Confirmar ticket</button>
    <button class="btn ghost" id="cancelarBtn">Cancelar</button>
  `;

  document.getElementById("backBtn").addEventListener("click", volverALista);
  document.getElementById("cancelarBtn").addEventListener("click", volverALista);

  det.querySelectorAll("input[data-campo]").forEach(inp => {
    inp.addEventListener("input", () => { ticketAbierto[inp.dataset.campo] = inp.value; });
  });

  renderItems();
  document.getElementById("addItemBtn").addEventListener("click", () => {
    ticketAbierto.items = ticketAbierto.items || [];
    ticketAbierto.items.push({ producto: "", precio: "", cantidad: 1 });
    renderItems();
  });

  document.getElementById("confirmarBtn").addEventListener("click", confirmarTicketActual);
}

function renderItems(){
  const body = document.getElementById("itemsBody");
  body.innerHTML = "";
  (ticketAbierto.items || []).forEach((it, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="text" value="${String(it.producto||"").replace(/"/g,'&quot;')}" data-i="${i}" data-f="producto"></td>
      <td class="col-precio"><input type="number" step="0.01" value="${it.precio||""}" data-i="${i}" data-f="precio"></td>
      <td class="col-cant"><input type="number" step="1" value="${it.cantidad||1}" data-i="${i}" data-f="cantidad"></td>
      <td><button type="button" class="del-item" data-i="${i}">✕</button></td>
    `;
    body.appendChild(tr);
  });

  body.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = Number(inp.dataset.i);
      ticketAbierto.items[i][inp.dataset.f] = inp.value;
      actualizarSumaLinea();
    });
  });
  body.querySelectorAll(".del-item").forEach(btn => {
    btn.addEventListener("click", () => {
      ticketAbierto.items.splice(Number(btn.dataset.i), 1);
      renderItems();
    });
  });

  actualizarSumaLinea();
}

function actualizarSumaLinea(){
  const suma = (ticketAbierto.items || []).reduce((a,it)=> a + (Number(it.precio)||0) * (Number(it.cantidad)||1), 0);
  const montoRef = Number(ticketAbierto["Monto (OCR)"] || ticketAbierto["Monto (declarado)"] || 0);
  const linea = document.getElementById("sumaLinea");
  const descuadra = montoRef > 0 && Math.abs(suma - montoRef) > 1;
  linea.classList.toggle("mismatch", descuadra);
  linea.textContent = `Suma de artículos: $${suma.toFixed(2)}` + (montoRef > 0 ? ` · Monto del ticket: $${montoRef.toFixed(2)}` : "") + (descuadra ? " — no cuadra" : "");
}

async function confirmarTicketActual(){
  const btn = document.getElementById("confirmarBtn");
  btn.disabled = true; btn.textContent = "Guardando…";

  const payload = {
    accion: "confirmar",
    codigo: codigoActual,
    ticketId: ticketAbierto["ID Ticket"],
    obra: ticketAbierto["Obra"],
    categoria: ticketAbierto["Categoría"],
    formaPago: ticketAbierto["Forma de pago"],
    tarjeta: ticketAbierto["Tarjeta"],
    montoDeclarado: ticketAbierto["Monto (declarado)"],
    montoOCR: ticketAbierto["Monto (OCR)"],
    fechaTicketOCR: ticketAbierto["Fecha del ticket (OCR)"],
    folioOCR: ticketAbierto["Folio (OCR)"],
    rfcOCR: ticketAbierto["RFC (OCR)"],
    nota: ticketAbierto["Nota"],
    items: (ticketAbierto.items || []).filter(it => it.producto || it.precio)
  };

  try{
    const data = await llamar(payload);
    if (data.success){
      showToast("✓ Ticket confirmado.");
      ticketsPendientes = ticketsPendientes.filter(t => t["ID Ticket"] !== ticketAbierto["ID Ticket"]);
      volverALista();
      renderLista();
    } else {
      showToast(data.message || "No se pudo confirmar.", true);
    }
  } catch(err){
    showToast("Sin conexión. Intenta de nuevo.", true);
  } finally {
    btn.disabled = false; btn.textContent = "Confirmar ticket";
  }
}

function showToast(msg, esError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!esError);
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 4000);
}

/* ícono para pantalla de inicio */
(function(){
  const iconSvg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
      <rect width="192" height="192" fill="#1C1B19"/>
      <rect x="40" y="40" width="112" height="112" rx="10" fill="#26241D" stroke="#F2B705" stroke-width="6"/>
      <path d="M64 96 L86 118 L128 74" stroke="#3D8361" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  const url = "data:image/svg+xml;base64," + btoa(iconSvg);
  document.getElementById("favicon").href = url;
  document.getElementById("appleicon").href = url;
})();
</script>
</body>
</html>
